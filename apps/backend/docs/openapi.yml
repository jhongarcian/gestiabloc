        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingStateRequest"
      responses:
        "200":
          description: Onboarding state updated
        "400":
          description: Invalid state action or step
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    TenantIdPathParam:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
    AutomationIdPathParam:
      in: path
      name: automationId
      required: true
      schema:
        type: string
    TaskIdPathParam:
      in: path
      name: taskId
      required: true
      schema:
        type: string
    TaskReminderIdPathParam:
      in: path
      name: reminderId
      required: true
      schema:
        type: string
    AccountSettingsSectionPathParam:
      in: path
      name: section
      required: true
      schema:
        type: string
        enum:
          - users
          - account
          - services
          - professionals
          - follow-ups
          - status-config
          - tags
          - features
          - subscription
          - custom-fields
    AccountSettingsRecordIdPathParam:
      in: path
      name: recordId
      required: true
      schema:
        type: string
    AccountSettingsPageQueryParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    AccountSettingsPageSizeQueryParam:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        enum: [10, 25]
        default: 10
  schemas:
    OnboardingProfileRequest:
      type: object
      required:
        - name
        - email
        - phone
        - website
        - addressLine1
        - addressLine2
        - city
        - state
        - postalCode
        - country
        - timezone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        addressLine1:
          type: string
          nullable: true
        addressLine2:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        state:
          type: string
          nullable: true
        postalCode:
          type: string
          nullable: true
        country:
          type: string
          nullable: true
        timezone:
          type: string
          nullable: true
    OnboardingWorkflowRequest:
      type: object
      required: [pipelineId, name, stages]
      properties:
        pipelineId:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        stages:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [id, name]
            properties:
              id:
                type: string
              name:
                type: string
                minLength: 1
                maxLength: 80
    OnboardingStateRequest:
      oneOf:
        - type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [start, skip, resume, complete, dismissChecklist]
        - type: object
          required: [action, step]
          properties:
            action:
              type: string
              enum: [advance]
            step:
              type: string
              enum: [welcome, business-profile, workflow, ready]
    OnboardingResponse:
      type: object
      required: [ok, onboarding, profile, defaults, readiness]
      properties:
        ok:
          type: boolean
        onboarding:
          type: object
          properties:
            status:
              type: string
              enum: [NOT_STARTED, IN_PROGRESS, SKIPPED, COMPLETED]
            currentStep:
              type: string
              enum: [welcome, business-profile, workflow, ready]
            startedAt:
              type: string
              format: date-time
              nullable: true
            skippedAt:
              type: string
              format: date-time
              nullable: true
            completedAt:
              type: string
              format: date-time
              nullable: true
            checklistDismissedAt:
              type: string
              format: date-time
              nullable: true
        profile:
          allOf:
            - $ref: "#/components/schemas/OnboardingProfileRequest"
            - type: object
              properties:
                id:
                  type: string
                slug:
                  type: string
        defaults:
          type: object
          additionalProperties: true
        readiness:
          type: object
          properties:
            serviceCount:
              type: integer
            memberCount:
              type: integer
    AutomationMutationRequest:
      type: object
      required: [name, isEnabled, trigger, conditions, actions]
      properties:
        name:
          type: string
          maxLength: 120
        isEnabled:
          type: boolean
        trigger:
          type: object
          additionalProperties: true
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AutomationConditionRequest"
        actions:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: true
    AutomationConditionRequest:
      type: object
      required: [source, operator]
      properties:
        source:
          type: string
          enum:
            - OPPORTUNITY_VALUE
            - CONTACT_STATUS
            - CONTACT_CUSTOM_FIELD
            - CONTACT_ASSIGNEE
            - CONTACT_TAGS
        operator:
          type: string
          enum:
            - EQUALS
            - NOT_EQUALS
            - CONTAINS
            - NOT_CONTAINS
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
            - BETWEEN
            - INCLUDES_ANY
            - INCLUDES_ALL
            - EXCLUDES_ALL
            - IS_TRUE
            - IS_FALSE
            - IS_EMPTY
            - IS_NOT_EMPTY
        customFieldId:
          type: string
          nullable: true
        statusConfigId:
          type: string
          nullable: true
        assignedUserId:
          type: string
          nullable: true
        tagId:
          type: string
          nullable: true
        compareValue:
          nullable: true
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
    OkWithUserId:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        userId:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "INVALID_CREDENTIALS"
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    TenantSignupRequest:
      type: object
      required: [tenantName, planKey, adminName, adminEmail, adminPassword]
      properties:
        tenantName:
          type: string
        planKey:
          type: string
          enum: [STARTER, PRO, BUSINESS]
        paidNow:
          type: boolean
          default: false
        adminName:
          type: string
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 8
    TenantSignupResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tenantId:
          type: string
        userId:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        requiresOtp:
          type: boolean
        challengeToken:
          type: string
          nullable: true
    OtpVerifyRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string
          description: 6-digit OTP
          pattern: "^[0-9]{6}$"
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          description: Must include at least one letter, one number, and one symbol.
    UpdateMeRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
    UpdatePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 200
        newPassword:
          type: string
          minLength: 8
          maxLength: 200
          description: Must include at least one letter, one number, and one symbol.
    MeResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
              format: email
            name:
              type: string
            image:
              type: string
              nullable: true
            platformRole:
              type: string
            emailVerified:
              type: boolean
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            memberships:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                  status:
                    type: string
                  securityLevel:
                    type: string
                    enum: [LOW, MEDIUM, MAX]
                  tenant:
                    type: object
                    properties:
                      id:
                        type: string
                      slug:
                        type: string
                      name:
                        type: string
                      timezone:
                        type: string
                        nullable: true
                      onboardingStatus:
                        type: string
                        enum: [NOT_STARTED, IN_PROGRESS, SKIPPED, COMPLETED]
                      onboardingCurrentStep:
                        type: string
                        enum: [welcome, business-profile, workflow, ready]
    PresignUploadRequest:
      type: object
      required: [tenantId, filename, contentType]
      properties:
        tenantId:
          type: string
        filename:
          type: string
        contentType:
          type: string
          description: "Allowed types: image/png, image/jpeg, image/jpg, image/webp, application/pdf"
    SignedUploadResponse:
      type: object
      properties:
        bucket:
          type: string
        path:
          type: string
        token:
          type: string
        fileId:
          type: string
    AvatarUploadRequest:
      type: object
      required: [tenantId, file]
      properties:
        tenantId:
          type: string
        file:
          type: string
          format: binary
    AvatarUploadResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        imageUrl:
          type: string
        fileId:
          type: string
    PresignDownloadRequest:
      type: object
