  /api/services/{tenantId}/contact-services/{contactServiceId}/step-occurrences/{occurrenceId}/complete:
    post:
      tags: [Services]
      summary: Complete the active enrolled service step
      description: >-
        Requires an active tenant administrator or MEDIUM/MAX member. Locks the enrollment and
        resolves exactly this active occurrence. Repeating a completed request returns its saved state.
        With no enabled matching completion actions, enters the next saved step immediately.
        Otherwise pins and queues the completion workflow; progression waits for successful completion
        of all its actions, including waits. Failure or exit saves PAUSED and a visible message.
        The final step completes a paid enrollment or leaves it PENDING_PAYMENT.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactServiceId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: occurrenceId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Completed occurrence and its current progression state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  occurrence:
                    $ref: "#/components/schemas/ServiceStepOccurrence"
        "401": { description: Not authenticated }
        "403": { description: Tenant access or security level denied }
        "404": { description: Enrollment or scoped occurrence not found }
        "409": { description: Wrong workflow kind, inactive enrollment, or occurrence not active }
  /api/services/{tenantId}/contact-services/{contactServiceId}/step-movements:
    post:
      tags: [Services]
      summary: Move, skip, or revisit a saved enrollment step
      description: >-
        Requires an active tenant administrator or MEDIUM/MAX member and a movement reason.
        MOVE enters targetStepId; SKIP enters the next saved step or finishes work.
        Skips bypass completion actions. The destination starts a new occurrence and entry triggers.
        Obsolete scoped work is stopped atomically. Completed history and payment requirements remain.
        Identical requestId retries return the saved movement; stale sources and conflicting retries return 409.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, expectedOccurrenceId, kind, reason]
              properties:
                requestId: { type: string, format: uuid }
                expectedOccurrenceId: { type: string, format: uuid }
                kind: { type: string, enum: [MOVE, SKIP] }
                targetStepId: { type: string, format: uuid, description: Required only for MOVE; a saved step belonging to this enrollment. }
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Saved movement, also returned for an identical retry
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  movement:
                    $ref: "#/components/schemas/ServiceStepMovement"
        "400": { description: Invalid reason, payload, or destination }
        "401": { description: Not authenticated }
        "403": { description: Tenant or security level denied }
        "404": { description: Enrollment not found }
        "409": { description: Source changed, duplicate request conflicts, or enrollment is inactive }
  /api/services/{tenantId}/contact-services/{contactServiceId}/step-occurrences/{occurrenceId}/deadline:
    post:
      tags: [Services]
      summary: Change or restore an enrollment step entry deadline
      description: >-
        Requires an active tenant admin or MEDIUM/MAX member. Only an ACTIVE non-superseded entry
        can change. Durations count from entry. Fixed dates must follow entry and be within ten years,
        but may be overdue. DEFAULT restores the frozen entry default. Does not move steps, fire
        triggers, or reschedule automation waits. History and revisions commit atomically.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: occurrenceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [requestId, expectedDeadlineRevision, schedule]
              properties:
                requestId: { type: string, format: uuid }
                expectedDeadlineRevision: { type: integer, minimum: 0, maximum: 2147483646 }
                schedule:
                  $ref: "#/components/schemas/ServiceStepDeadlineSchedule"
      responses:
        "200":
          description: Canonical occurrence including frozen default, current override, revision and deadline history
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  occurrence:
                    $ref: "#/components/schemas/ServiceStepOccurrence"
        "400": { description: Invalid duration, date, or payload }
        "401": { description: Not authenticated }
        "403": { description: Tenant access or security level denied }
        "404": { description: Scoped enrollment or occurrence not found }
        "409": { description: Stale deadline revision, conflicting retry, moved/completed entry, or inactive enrollment }
  /api/services/{tenantId}/contact-services/{contactServiceId}/step-occurrences/{occurrenceId}/completion-wait:
    get:
      tags: [Services]
      summary: Get all pending completion workflow waits for this exact occurrence
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: occurrenceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Pending root completion waits; wait is the first result or null for compatibility.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  waits:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceStepCompletionWait"
                  wait:
                    $ref: "#/components/schemas/ServiceStepCompletionWait"
        "401": { description: Not authenticated }
        "403": { description: Tenant access denied }
        "404": { description: Scoped occurrence not found }
  /api/services/{tenantId}/contact-services/{contactServiceId}/step-occurrences/{occurrenceId}/completion-wait/continue:
    post:
      tags: [Services]
      summary: End the current completion wait and run the remaining actions
      description: >-
        Requires a tenant administrator or MEDIUM/MAX member. Atomically releases exactly the displayed
        wait and wakes the existing worker. Does not skip remaining workflow actions. Concurrent or stale
        requests cannot replay actions, bypass a later wait, or advance twice. Records the actor and schedule change.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: occurrenceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceStepWaitTarget"
      responses:
        "200": { description: Current wait released; remaining completion actions queued to resume }
        "400": { description: Invalid target input }
        "401": { description: Not authenticated }
        "403": { description: Tenant access or security level denied }
        "404": { description: Scoped occurrence or root completion run not found }
        "409": { description: Wait or schedule already changed, or enrollment no longer active }
  /api/services/{tenantId}/contact-services/{contactServiceId}/step-occurrences/{occurrenceId}/completion-wait/reschedule:
    post:
      tags: [Services]
      summary: Change only this enrollment's current completion wait
      description: >-
        Requires a tenant administrator or MEDIUM/MAX member. Changes the current wait while preserving
        pinned actions, cursor and branch state. A claimed but unstarted worker is fenced out. An executing
        worker finishes its transaction before this request revalidates its target; stale edits return 409.
        Records actor, old/new schedules, occurrence and time. Source workflow and other enrollments are unchanged.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: occurrenceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ServiceStepWaitTarget"
                - type: object
                  required: [schedule]
                  properties:
                    schedule:
                      oneOf:
                        - type: object
                          additionalProperties: false
                          required: [mode, amount, unit]
                          properties:
                            mode: { type: string, enum: [DURATION] }
                            amount: { type: integer, minimum: 1, maximum: 315360000 }
                            unit: { type: string, enum: [SECONDS, MINUTES, HOURS, DAYS] }
                          description: Positive duration starting when saved; at most ten years after converting units.
                        - type: object
                          additionalProperties: false
                          required: [mode, dateTime]
                          properties:
                            mode: { type: string, enum: [FIXED_DATE] }
                            dateTime: { type: string, format: date-time }
                          description: Future absolute date/time with UTC or numeric offset, at most ten years ahead.
      responses:
        "200": { description: Canonical wait returned after rescheduling }
        "400": { description: Invalid target, duration, or future date/time }
        "401": { description: Not authenticated }
        "403": { description: Tenant access or security level denied }
        "404": { description: Scoped occurrence or root completion run not found }
        "409": { description: Wait or schedule already changed, or enrollment no longer active }
