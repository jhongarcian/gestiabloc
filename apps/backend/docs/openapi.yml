  /api/account-settings/{tenantId}/ai/settings:
    parameters:
      - $ref: "#/components/parameters/TenantIdPathParam"
    get:
      tags: [Account Settings]
      summary: Read the account AI helper settings
      description: Requires an active tenant administrator. Returns clean defaults without creating a row for accounts with no saved settings.
      security: [{ cookieAuth: [] }]
      responses:
        "200":
          $ref: "#/components/responses/AiHelperSettingsSaved"
        "401":
          description: Authentication required
        "403":
          description: Active tenant administrator access required
    patch:
      tags: [Account Settings]
      summary: Save the account AI helper name and preferences
      description: Requires an active tenant administrator and an allowed browser origin. Sends the current text revision; avatar changes use an independent revision. Does not activate AI conversations or change service profiles.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiHelperSettingsUpdate"
      responses:
        "200":
          $ref: "#/components/responses/AiHelperSettingsSaved"
        "400":
          description: Invalid fields or unexpected properties
        "401":
          description: Authentication required
        "403":
          description: Active tenant administrator access and allowed origin required
        "409":
          description: AI_SETTINGS_CONFLICT — reload saved settings and explicitly resolve the text conflict before retrying
  /api/account-settings/{tenantId}/ai/avatar:
    parameters:
      - $ref: "#/components/parameters/TenantIdPathParam"
    post:
      tags: [Account Settings]
      summary: Upload or replace the account AI helper avatar
      description: Requires an active tenant administrator and an allowed browser origin. Accepts one PNG, JPEG, or WebP image up to 5 MiB, verified against its content signature. Stored separately from personal profile avatars. Failed uploads or stale revisions retain the saved avatar; replaced AI files are cleaned up after the new avatar is saved.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file, avatarRevision]
              properties:
                file:
                  type: string
                  format: binary
                avatarRevision:
                  type: integer
                  minimum: 0
                  maximum: 2147483646
      responses:
        "200":
          $ref: "#/components/responses/AiHelperSettingsSaved"
        "400":
          description: Missing file, invalid image, unexpected upload fields, or invalid revision
        "401":
          description: Authentication required
        "403":
          description: Active tenant administrator access and allowed origin required
        "409":
          description: AI_AVATAR_CONFLICT — reload the saved avatar before choosing again
        "413":
          description: FILE_TOO_LARGE — image exceeds 5 MiB
        "503":
          description: AVATAR_UPLOAD_FAILED — storage unavailable; current avatar unchanged
    patch:
      tags: [Account Settings]
      summary: Choose a built-in helper avatar
      description: Requires an active tenant administrator and an allowed browser origin. Replaces any uploaded helper image immediately.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [presetId, avatarRevision]
              properties:
                presetId:
                  type: string
                  enum: [bot, sparkles, compass, lightbulb]
                avatarRevision:
                  type: integer
                  minimum: 0
                  maximum: 2147483646
      responses:
        "200":
          $ref: "#/components/responses/AiHelperSettingsSaved"
        "400":
          description: Invalid preset or revision
        "401":
          description: Authentication required
        "403":
          description: Active tenant administrator access and allowed origin required
        "409":
          description: AI_AVATAR_CONFLICT
    delete:
      tags: [Account Settings]
      summary: Remove the uploaded helper avatar and restore the bot
      description: Requires an active tenant administrator and an allowed browser origin. Does not affect any personal profile avatar.
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [avatarRevision]
              properties:
                avatarRevision:
                  type: integer
                  minimum: 0
                  maximum: 2147483646
      responses:
        "200":
          $ref: "#/components/responses/AiHelperSettingsSaved"
        "400":
          description: Invalid revision
        "401":
          description: Authentication required
        "403":
          description: Active tenant administrator access and allowed origin required
        "409":
          description: AI_AVATAR_CONFLICT
  /api/account-settings/{tenantId}/ai/skills:
    get:
      tags: [AI]
      summary: List real account sub-services and qualification fields
      description: Account admins only. Includes inactive offerings and parent status. Does not load contact records or call AI.
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Tenant-scoped skills, including inherited service notes
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  skills:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiSkill"
                  fields:
                    type: array
                    items:
                      $ref: "#/components/schemas/AiQualificationField"
        "401": { description: Authentication required }
        "403": { description: Active tenant administrator access required }
  /api/account-settings/{tenantId}/ai/skills/{skillId}:
    parameters:
      - $ref: "#/components/parameters/TenantIdPathParam"
      - in: path
        name: skillId
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [AI]
      summary: Read a tenant sub-service skill
      responses:
        "200":
          $ref: "#/components/responses/AiSkillSaved"
        "401": { description: Authentication required }
        "403": { description: Active tenant administrator access required }
        "404": { description: Offering not found in this tenant }
  /api/account-settings/{tenantId}/ai/skills/{skillId}/qualification:
    parameters:
      - $ref: "#/components/parameters/TenantIdPathParam"
      - in: path
        name: skillId
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [AI]
      summary: Save only a skill's qualification configuration
      description: Uses the existing fit field catalog and deterministic engine validation. Locks the service hierarchy and rejects stale revisions. Preserves knowledge, verification, and all other service configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [revision, qualification]
              properties:
                revision: { type: string, pattern: "^[a-f0-9]{64}$" }
                qualification:
                  $ref: "#/components/schemas/AiQualification"
      responses:
        "200":
          $ref: "#/components/responses/AiSkillSaved"
        "400": { description: Invalid request or qualification condition }
        "401": { description: Authentication required }
        "403": { description: Administrator access required or untrusted origin }
        "404": { description: Offering not found in this tenant }
        "409": { description: AI_QUALIFICATION_CONFLICT or AI_PROFILE_REVIEW_REQUIRED; existing configuration remains unchanged }
components:
  responses:
    AiSkillSaved:
      description: Current skill and its available qualification field catalog
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean, enum: [true] }
              skill:
                $ref: "#/components/schemas/AiSkill"
              fields:
                type: array
                items:
                  $ref: "#/components/schemas/AiQualificationField"
    AiHelperSettingsSaved:
      description: Current persisted helper settings, including independent text and avatar revisions
      content:
        application/json:
          schema:
            type: object
            required: [ok, settings]
            properties:
              ok:
                type: boolean
                enum: [true]
              settings:
                $ref: "#/components/schemas/AiHelperSettings"
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    TenantIdPathParam:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
    AutomationIdPathParam:
      in: path
      name: automationId
      required: true
      schema:
        type: string
    AutomationProcessIdPathParam:
      in: path
      name: processId
      required: true
      schema:
        type: string
    TaskIdPathParam:
      in: path
      name: taskId
      required: true
      schema:
        type: string
    TaskReminderIdPathParam:
      in: path
      name: reminderId
      required: true
      schema:
        type: string
    AccountSettingsSectionPathParam:
      in: path
      name: section
      required: true
      schema:
        type: string
        enum:
          - users
          - account
          - services
          - professionals
          - status-config
          - tags
          - features
          - subscription
          - custom-fields
    AccountSettingsRecordIdPathParam:
      in: path
      name: recordId
      required: true
      schema:
        type: string
    AccountSettingsPageQueryParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    AccountSettingsPageSizeQueryParam:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        enum: [10, 25]
        default: 10
  schemas:
    AiQualificationField:
      type: object
      properties:
        source: { type: string, enum: [core, custom, status, tags, derived] }
        fieldKey: { type: string }
        label: { type: string }
        description: { type: string, nullable: true }
        valueType: { type: string, enum: [string, number, boolean, date, stringArray] }
        operators:
          type: array
          items: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              value: { type: string }
              label: { type: string }
    AiQualification:
      type: object
      additionalProperties: false
      required: [enabled, summary, rules, requirementMetadata, optionMetadata]
      properties:
        enabled: { type: boolean }
        summary: { type: string, maxLength: 2000 }
        rules:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [id, source, fieldKey, valueType, operator, compareValue, required, requiredGroup, requiredBranch, weight, label, explanation]
            properties:
              id: { type: string, minLength: 1, maxLength: 120 }
              source: { type: string, enum: [core, custom, status, tags, derived] }
              fieldKey: { type: string, minLength: 1, maxLength: 120 }
              valueType: { type: string, enum: [string, number, boolean, date, stringArray] }
              operator:
                type: string
                enum: [equals, not_equals, contains, not_contains, greater_than, greater_than_or_equal, less_than, less_than_or_equal, between, includes_any, includes_all, excludes_all, is_true, is_false, is_empty, is_not_empty]
              compareValue:
                description: Comparison value, an array of strings, a min/max range, or null for presence and boolean operators
              required: { type: boolean }
              requiredGroup: { type: string, nullable: true, maxLength: 120 }
              requiredBranch: { type: string, nullable: true, maxLength: 120 }
              weight: { type: integer, minimum: 1, maximum: 10 }
              label: { type: string, nullable: true, maxLength: 160 }
              explanation: { type: string, nullable: true, maxLength: 300 }
        requirementMetadata:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [name, description]
            properties:
              name: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
        optionMetadata:
          type: array
          maxItems: 200
          items:
            type: object
            additionalProperties: false
            required: [requirementName, optionName, description]
            properties:
              requirementName: { type: string, minLength: 1, maxLength: 120 }
              optionName: { type: string, minLength: 1, maxLength: 120 }
              description: { type: string, maxLength: 2000 }
    AiSkill:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parentId: { type: string, format: uuid, nullable: true }
        parentName: { type: string }
        isActive: { type: boolean }
        parentActive: { type: boolean }
        availableToAssistant: { type: boolean }
        tagline: { type: string }
        revision: { type: string, pattern: "^[a-f0-9]{64}$" }
        qualificationReadOnlyReason: { type: string, nullable: true }
        qualification:
          $ref: "#/components/schemas/AiQualification"
        knowledgeProfile:
          type: object
          description: Existing normalized service knowledge; read-only in this API
        verificationProfile:
          type: object
          description: Existing normalized verification guidance; read-only in this API
        notes:
          type: object
          description: Effective service overview, pricing and non-archived checklist with owning source service IDs, including parent inheritance
          properties:
            overview: { type: string }
            pricing:
              type: object
              properties:
                basePriceCents: { type: integer }
                currency: { type: string }
            checklist:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  label: { type: string }
                  description: { type: string, nullable: true }
                  isRequired: { type: boolean }
                  sortOrder: { type: integer }
            sources:
              type: object
              properties:
                overview: { type: string, format: uuid }
                pricing: { type: string, format: uuid }
                checklist: { type: string, format: uuid }
    AiHelperSettingsUpdate:
      type: object
      additionalProperties: false
      required: [name, language, tone, instructions, revision]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: AI Helper
        language:
          type: string
          enum: [English, Spanish, English and Spanish]
        tone:
          type: string
          enum: [Professional, Warm, Direct]
        instructions:
          type: string
          maxLength: 4000
        revision:
          type: integer
          minimum: 0
          maximum: 2147483646
    AiHelperSettings:
      type: object
      required: [name, language, tone, instructions, revision, avatar]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          example: AI Helper
        language:
          type: string
          enum: [English, Spanish, English and Spanish]
        tone:
          type: string
          enum: [Professional, Warm, Direct]
        instructions:
          type: string
          maxLength: 4000
        revision:
          type: integer
          minimum: 0
          maximum: 2147483646
        avatar:
          type: object
          required: [presetId, imageUrl, revision]
          properties:
            presetId:
              type: string
              enum: [bot, sparkles, compass, lightbulb]
            imageUrl:
              type: string
              format: uri
              nullable: true
            revision:
              type: integer
              minimum: 0
              maximum: 2147483646
    RetiredServiceWorkflow:
      type: object
      nullable: true
      description: Read-only attribution for a retired template enrollment.
        Definitions, variables and archived execution inputs are never exposed or
        replayed. Finish remaining saved steps manually.
      properties:
        template:
          type: object
          nullable: true
          properties:
            id:
