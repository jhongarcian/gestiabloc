    AutomationTriggerRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, serviceGroupId, serviceOfferingId, serviceTriggerConfig]
          description: >-
            Enrollment-only context for SERVICE_STEPS enrollments. Null sub-service scope includes
            current and future eligible offerings in the group. Contact fields, supported custom fields,
            and tags use event-time values. Only coordinator, professional, checklist and service-status
            actions are available; these workflows do not add completion gates.
          properties:
            type: { type: string, enum: [SERVICE_ENROLLED] }
            serviceGroupId: { type: string, format: uuid }
            serviceOfferingId: { type: string, format: uuid, nullable: true }
            serviceTriggerConfig:
              type: object
              additionalProperties: false
              properties: {}
        - type: object
          additionalProperties: false
          required: [type, serviceGroupId, serviceOfferingId, serviceTriggerConfig]
          description: >-
            Enrollment-only context for SERVICE_STEPS enrollments. Null sub-service scope includes
            current and future eligible offerings in the group. Contact fields, supported custom fields,
            and tags use event-time values. Only coordinator, professional, checklist and service-status
            actions are available; these workflows do not add completion gates.
          properties:
            type: { type: string, enum: [SERVICE_STATUS_CHANGED] }
            serviceGroupId: { type: string, format: uuid }
            serviceOfferingId: { type: string, format: uuid, nullable: true }
            serviceTriggerConfig:
              type: object
              additionalProperties: false
              required: [previousStatus, status]
              properties:
                previousStatus: { type: string, nullable: true, enum: [IN_PROGRESS, PENDING_PAYMENT, COMPLETED, CANCELED, null] }
                status: { type: string, nullable: true, enum: [IN_PROGRESS, PENDING_PAYMENT, COMPLETED, CANCELED, null] }
        - type: object
          additionalProperties: false
          required: [type, serviceGroupId, serviceOfferingId, serviceTriggerConfig]
          description: >-
            Enrollment-only context for SERVICE_STEPS enrollments. Null sub-service scope includes
            current and future eligible offerings in the group. Contact fields, supported custom fields,
            and tags use event-time values. Only coordinator, professional, checklist and service-status
            actions are available; these workflows do not add completion gates.
          properties:
            type: { type: string, enum: [SERVICE_CHECKLIST_STATUS_CHANGED] }
            serviceGroupId: { type: string, format: uuid }
            serviceOfferingId: { type: string, format: uuid, nullable: true }
            serviceTriggerConfig:
              type: object
              additionalProperties: false
              required: [checklistItemId, previousStatus, status]
              properties:
                checklistItemId: { type: string, format: uuid, nullable: true, description: Stable source item ID; null matches any enrolled item. }
                previousStatus: { type: string, nullable: true, enum: [NOT_RECEIVED, INFORMED, MISSING, RECEIVED, null] }
                status: { type: string, nullable: true, enum: [NOT_RECEIVED, INFORMED, MISSING, RECEIVED, null] }
        - type: object
          additionalProperties: false
          required: [type, serviceGroupId, serviceOfferingId, serviceTriggerConfig]
          description: >-
            Enrollment-only context for SERVICE_STEPS enrollments. Null sub-service scope includes
            current and future eligible offerings in the group. Contact fields, supported custom fields,
            and tags use event-time values. Only coordinator, professional, checklist and service-status
            actions are available; these workflows do not add completion gates.
          properties:
            type: { type: string, enum: [SERVICE_PAYMENT_CHANGED] }
            serviceGroupId: { type: string, format: uuid }
            serviceOfferingId: { type: string, format: uuid, nullable: true }
            serviceTriggerConfig:
              type: object
              additionalProperties: false
              required: [changes, paymentState]
              properties:
                changes:
                  type: array
                  minItems: 1
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, enum: [ADDED, UPDATED, REMOVED] }
                  description: Added includes positive initial payments. Updated compares amount, paidAt, method and note after normalization.
                paymentState: { type: string, nullable: true, enum: [UNPAID, PARTIAL, PAID, null], description: Resulting payment balance; independent of service completion. }
        - type: object
          additionalProperties: false
          required: [type, serviceStepId]
          description: >-
            Select an active sub-service and one of its effective active steps. Multiple automations
            may target the same step/event. New automations require serviceOfferingId; existing shared
            workflows may retain null scope. Published actions run once per occurrence. All matching
            completion workflows must succeed before the next saved step starts. Contact field,
            safe custom-field, and tag filters use event-time values.
          properties:
            type:
              type: string
              enum: [SERVICE_STEP_ENTERED, SERVICE_STEP_COMPLETED]
            serviceStepId:
              type: string
              format: uuid
            serviceOfferingId:
              type: string
              format: uuid
              nullable: true
              description: Required for new service-step triggers. Null retains the scope of an existing shared workflow.
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [CONTACT_CREATED]
        - type: object
          additionalProperties: false
          required: [type]
          description: Runs when a note is added to a contact. Optional filters may use contact fields, active non-sensitive custom fields, and tags, evaluated after the note is saved.
          properties:
            type:
              type: string
              enum: [CONTACT_NOTE_ADDED]
        - type: object
          additionalProperties: false
          required: [type]
          description: Runs when a task is created for a contact. Optional task and contact filters are evaluated against creation-time values. Each Task added automation can enroll once per automation chain.
          properties:
            type:
              type: string
              enum: [TASK_ADDED]
        - type: object
          additionalProperties: false
          required: [type]
          description: Runs when an existing contact-linked task changes from a non-completed status to Completed. Optional contact field, active non-sensitive custom field, and tag filters use the contact state at completion. Each Task completed automation can enroll once per chain.
          properties:
            type:
              type: string
              enum: [TASK_COMPLETED]
        - type: object
          additionalProperties: false
          required: [type]
          description: Runs when a contact appointment is booked. Optional appointment and contact filters use booking-time values. Service filters match the appointment's service ID, can include several services, or match no service. Each automation can enroll once per chain.
          properties:
            type:
              type: string
              enum: [APPOINTMENT_CREATED]
        - type: object
          additionalProperties: false
          required: [type, status]
          description: Runs when an existing appointment actually changes to the selected status, from any previous status. Optional contact field, active non-sensitive custom field, and tag filters use the contact state at the time of the change. Each automation can enroll once per chain.
          properties:
            type:
              type: string
              enum: [APPOINTMENT_STATUS_CHANGED]
            status:
              type: string
              enum: [SCHEDULED, CONFIRMED, SHOW, NO_SHOW, CANCELED, COMPLETED]
        - type: object
          additionalProperties: false
          required: [type, localTime]
          description: Runs once per contact per tenant-local calendar year on their birthday. Uses the tenant timezone, excludes deceased contacts, and evaluates optional contact field, active non-sensitive custom field, and tag filters when queued. February 29 birthdays use February 28 in non-leap years.
          properties:
            type:
              type: string
              enum: [BIRTHDAY_REMINDER]
            localTime:
              type: string
              pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
              example: '09:00'
        - type: object
          additionalProperties: false
          required: [type, tagId, change]
          description: Runs when the selected tag is added to or removed from a contact. Optional contact filters evaluate the resulting contact state.
          properties:
            type:
              type: string
              enum: [CONTACT_TAG]
            tagId:
              type: string
              format: uuid
              description: One existing tag in the tenant.
            change:
              type: string
              enum: [ADDED, REMOVED]
        - type: object
          additionalProperties: false
          required: [type, changes]
          properties:
            type:
              type: string
              enum: [CONTACT_CHANGED]
            changes:
              type: array
              minItems: 1
              maxItems: 20
              description: All rules must match during one contact update. Optional contact filters evaluate the resulting state.
              items:
                oneOf:
                  - type: object
                    required: [source, operator, fieldKey]
                    properties:
                      source: { type: string, enum: [CONTACT_FIELD] }
                      operator: { type: string, enum: [HAS_CHANGED, HAS_CHANGED_TO] }
                      fieldKey: { type: string }
                      value: { nullable: true, description: Required for HAS_CHANGED_TO; null means cleared. }
                  - type: object
                    required: [source, operator, customFieldId]
                    properties:
                      source: { type: string, enum: [CONTACT_CUSTOM_FIELD] }
                      operator: { type: string, enum: [HAS_CHANGED, HAS_CHANGED_TO] }
                      customFieldId: { type: string, format: uuid }
                      value: { nullable: true, description: Required for HAS_CHANGED_TO; null means cleared. }
                  - type: object
                    required: [source, operator]
                    properties:
                      source: { type: string, enum: [CONTACT_STATUS] }
                      operator: { type: string, enum: [HAS_CHANGED, HAS_CHANGED_TO] }
                      statusConfigId: { type: string, format: uuid, description: Required for HAS_CHANGED_TO. }
                  - type: object
                    required: [source, operator]
                    properties:
                      source: { type: string, enum: [CONTACT_ASSIGNEE] }
                      operator: { type: string, enum: [HAS_CHANGED, HAS_CHANGED_TO] }
                      assignedUserId: { type: string, format: uuid, nullable: true, description: Required for HAS_CHANGED_TO; null means unassigned. }
                  - type: object
                    required: [source, operator]
                    properties:
                      source: { type: string, enum: [CONTACT_TAGS] }
                      operator: { type: string, enum: [ADDED, REMOVED] }
                      tagId: { type: string, format: uuid, nullable: true, description: Omit or set null for any tag. }
        - type: object
          additionalProperties: false
          required: [type, pipelineId]
          properties:
            type:
              type: string
              enum: [OPPORTUNITY_CREATED]
            pipelineId:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required: [type, pipelineId, change]
          properties:
            type:
              type: string
              enum: [OPPORTUNITY_CHANGED]
            pipelineId:
              type: string
              format: uuid
            change:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [type, stageId]
                  properties:
                    type:
                      type: string
                      enum: [STAGE_ENTERED]
                    stageId:
                      type: string
                      format: uuid
                - type: object
                  additionalProperties: false
                  required: [type, result]
                  properties:
                    type:
                      type: string
                      enum: [RESULT_CHANGED]
                    result:
                      type: string
                      enum: [WON, LOST]
    AutomationMutationRequest:
      type: object
      required: [name, isEnabled, trigger, conditions, actions]
      properties:
        name:
          type: string
          maxLength: 120
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Optional destination folder on creation; ignored on configuration edits.
        isEnabled:
          type: boolean
        trigger:
          $ref: "#/components/schemas/AutomationTriggerRequest"
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AutomationConditionRequest"
        actions:
          type: array
          minItems: 0
          maxItems: 100
          description: At most 100 action nodes across the complete tree. Disabled service-trigger drafts may have zero actions. Publishing always requires at least one action.
          items:
            $ref: "#/components/schemas/AutomationActionRequest"
    AutomationFolderNameRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Trimmed and case-insensitively unique within the tenant.
    AutomationFolder:
      type: object
      required: [id, name, sortOrder, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AutomationLibraryRecord:
      type: object
      description: Full automation record; extra workflow fields are included.
      required: [id, name, sortOrder, folderId, librarySortOrder]
      additionalProperties: true
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          description: Global execution priority.
        folderId:
          type: string
          format: uuid
          nullable: true
        librarySortOrder:
          type: integer
    AutomationActionRequest:
      type: object
      required: [type]
      properties:
        nodeKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable action identifier; generated by the server when omitted.
        type:
          type: string
          enum:
            - UPDATE_CONTACT_CUSTOM_FIELDS
            - SET_CONTACT_CUSTOM_FIELD
            - CLEAR_CONTACT_CUSTOM_FIELD
            - SET_CONTACT_STATUS
            - SET_CONTACT_ASSIGNEE
            - CLEAR_CONTACT_ASSIGNEE
            - ADD_CONTACT_TAG
            - REMOVE_CONTACT_TAG
            - ADD_CONTACT_NOTE
            - CREATE_CONTACT
            - CREATE_TASK
            - CREATE_APPOINTMENT
            - UPDATE_APPOINTMENT_STATUS
            - SEND_INTERNAL_NOTIFICATION
            - FORMAT_DATE_TIME
            - FORMAT_NUMBER
            - FORMAT_TEXT
            - MATH_OPERATION
            - IF_ELSE
            - SPLIT
            - GO_TO
            - ADD_TO_WORKFLOW
            - REMOVE_FROM_WORKFLOW
            - UPDATE_OPPORTUNITY
            - DELETE_OPPORTUNITY
            - WAIT
            - DELETE_CONTACT
            - MOVE_SERVICE_STEP
            - COMPLETE_SERVICE_STEP
            - SKIP_SERVICE_STEP
            - SCHEDULE_SERVICE_STEP
            - SET_SERVICE_STEP_OWNER
            - SET_SERVICE_COORDINATOR
            - SET_SERVICE_PROFESSIONAL
            - SET_SERVICE_CHECKLIST_STATUS
            - SET_SERVICE_STATUS
          description: >-
            DELETE_CONTACT permanently removes the contact from the tenant account and
            must be the final action in the automation. GO_TO must be final in its source
            path and may only reference a destination that keeps the workflow acyclic.
        serviceConfig:
          $ref: "#/components/schemas/AutomationServiceActionConfig"
        customFieldId:
          type: string
        customFieldUpdates:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: false
          description: >-
            Distinct standard or custom contact fields updated atomically by one action node.
            Standard fields use contactFieldKey; custom fields use customFieldId.
          items:
            $ref: "#/components/schemas/AutomationCustomFieldUpdate"
        statusConfigId:
          type: string
        assignedUserId:
          type: string
        tagId:
          type: string
        value: {}
        noteTitle:
          type: string
          maxLength: 160
          description: >-
            Contact-note title template. Supports regular fields such as {contact.name},
            custom fields such as {contact.custom_field.bank}, and compatible date,
            phone, or USD currency format modifiers. Dynamic tenant-local dates use
            {date.current|date:medium}; relative dates use tokens such as
            {date.relative.2.weeks|date:medium}; fixed date-only values use tokens such as
            {date.specific.2026-09-23|date:medium}.
        noteBody:
          type: string
          maxLength: 5000
          description: >-
            Contact-note body template using the same contact-field token grammar as noteTitle.
            Contact values and current-date values are resolved when the action executes.
            Formatter outputs from earlier actions use {automation.output_key} without a
            formatting modifier.
        createContactConfig:
          $ref: "#/components/schemas/AutomationCreateContactConfig"
        taskConfig:
          $ref: "#/components/schemas/AutomationTaskConfig"
        appointmentConfig:
          $ref: "#/components/schemas/AutomationAppointmentConfig"
        appointmentStatusConfig:
          $ref: "#/components/schemas/AutomationAppointmentStatusConfig"
        internalNotificationConfig:
          $ref: "#/components/schemas/AutomationInternalNotificationConfig"
        dateTimeFormatterConfig:
          $ref: "#/components/schemas/AutomationDateTimeFormatterConfig"
        numberFormatterConfig:
          $ref: "#/components/schemas/AutomationNumberFormatterConfig"
        textFormatterConfig:
          $ref: "#/components/schemas/AutomationTextFormatterConfig"
        mathOperationConfig:
          $ref: "#/components/schemas/AutomationMathOperationConfig"
        ifElseConfig:
          $ref: "#/components/schemas/AutomationIfElseConfig"
        splitConfig:
          $ref: "#/components/schemas/AutomationSplitConfig"
        goToConfig:
          $ref: "#/components/schemas/AutomationGoToConfig"
        opportunityConfig:
          $ref: "#/components/schemas/AutomationOpportunityConfig"
        deleteOpportunityConfig:
          $ref: "#/components/schemas/AutomationDeleteOpportunityConfig"
        addToWorkflowConfig:
          $ref: "#/components/schemas/AutomationAddToWorkflowConfig"
        removeFromWorkflowConfig:
          $ref: "#/components/schemas/AutomationRemoveFromWorkflowConfig"
        waitConfig:
          oneOf:
            - type: object
              required: [mode, amount, unit]
              properties:
                mode:
                  type: string
                  enum: [DURATION]
                amount:
                  type: integer
                  minimum: 1
                unit:
                  type: string
                  enum: [SECONDS, MINUTES, HOURS, DAYS]
            - type: object
              required: [mode, dateTime, timing, pastBehavior]
              properties:
                mode:
                  type: string
                  enum: [FIXED_DATE]
                dateTime:
                  type: string
                  format: date-time
                timing:
                  type: string
                  enum: [ON, BEFORE, AFTER]
                offsetAmount:
                  type: integer
                  minimum: 1
                offsetUnit:
                  type: string
                  enum: [SECONDS, MINUTES, HOURS, DAYS]
                pastBehavior:
                  type: string
                  enum: [CONTINUE, EXIT, GO_TO_STEP]
                targetNodeKey:
                  type: string
                  minLength: 1
                  maxLength: 200
    AutomationServiceActionConfig:
      description: >-
        Configuration selected by the action type. All service triggers support coordinator,
        professional, checklist and service-status actions. Movement, completion, skipping, scheduling
        and step ownership require step-entry/completion context and its exact saved occurrence.
        Execution always requires the triggering enrollment. Source IDs resolve against saved records; missing
        snapshots are rejected. Shared triggers accept only choices common to eligible sub-services.
        Move, Skip, Complete and CANCELED end their execution path and must be placed last.
      oneOf:
        - type: object
          additionalProperties: false
          required: [targetSourceStepId, reason]
          properties:
            targetSourceStepId: { type: string, format: uuid }
            reason: { type: string, minLength: 1, maxLength: 1000 }
        - type: object
          additionalProperties: false
          maxProperties: 0
          description: COMPLETE_SERVICE_STEP; completing an already-completed entry emits no event.
        - type: object
          additionalProperties: false
          required: [reason]
          properties:
            reason: { type: string, minLength: 1, maxLength: 1000 }
        - type: object
          additionalProperties: false
          required: [schedule]
          properties:
            schedule:
              $ref: "#/components/schemas/ServiceStepDeadlineSchedule"
        - type: object
          additionalProperties: false
          required: [assignedToUserId]
          description: Step owner or coordinator. Active tenant member, or null for Unassigned.
          properties:
            assignedToUserId: { type: string, format: uuid, nullable: true }
        - type: object
          additionalProperties: false
          required: [professionalId]
          properties:
            professionalId: { type: string, format: uuid, nullable: true }
        - type: object
          additionalProperties: false
          required: [checklistItemId, status]
          properties:
            checklistItemId: { type: string, format: uuid, description: Stable source checklist ID }
            status: { type: string, enum: [NOT_RECEIVED, INFORMED, MISSING, RECEIVED] }
        - type: object
          additionalProperties: false
          required: [status]
          description: IN_PROGRESS requires unfinished steps. Completion and payment statuses remain derived.
          properties:
            status: { type: string, enum: [IN_PROGRESS, CANCELED] }
    AutomationGoToConfig:
      type: object
      required: [targetNodeKey]
      description: >-
        Routes execution to the exact saved action and continues through that destination
        path. Go To must be terminal in its source path, and the complete workflow graph
        must remain acyclic.
      properties:
        targetNodeKey:
          type: string
          minLength: 1
          maxLength: 200
          description: Stable node key of an executable action in the same automation.
    AutomationAddToWorkflowConfig:
      type: object
      required: [actionName, targetAutomationId, targetAutomationNameSnapshot]
      description: >-
        Queues a new independent run of another published automation for the same contact.
        The target starts at its first action without evaluating its trigger or entry filters.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        targetAutomationId:
          type: string
          format: uuid
        targetAutomationNameSnapshot:
          type: string
          minLength: 1
          maxLength: 120
          description: Refreshed from the target automation when the source is saved.
    AutomationRemoveFromWorkflowConfig:
      type: object
      required: [actionName, targetAutomationId, targetAutomationNameSnapshot]
      description: >-
        Ends every queued, running, or waiting run of a published automation for the
        same contact. Historical runs remain available and the contact may enter again.
        Selecting the current automation exits the current run after this action.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        targetAutomationId:
          type: string
          format: uuid
        targetAutomationNameSnapshot:
          type: string
          minLength: 1
          maxLength: 120
          description: Refreshed from the target automation when the source is saved.
    AutomationCreateContactTypedSource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, value]
          properties:
            type:
              type: string
              enum: [FIXED]
            value: {}
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [CONTACT_FIELD, CUSTOM_FIELD, AUTOMATION_VALUE]
            key:
              type: string
              minLength: 1
              maxLength: 100
    AutomationCreateContactValueSource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, template]
          properties:
            type:
              type: string
              enum: [TEMPLATE]
            template:
              type: string
              maxLength: 1000
        - $ref: "#/components/schemas/AutomationCreateContactTypedSource"
    AutomationCreateContactConfig:
      type: object
      additionalProperties: false
      required:
        - actionName
        - firstNameTemplate
        - lastNameTemplate
        - statusConfigId
        - customFieldValues
      description: >-
        Creates a standalone contact while the automation continues on its original
        contact. An existing tenant contact with the rendered email or phone makes the
        action a successful no-op.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        firstNameTemplate:
          type: string
          minLength: 1
          maxLength: 1000
        middleNameTemplate:
          type: string
          maxLength: 1000
          nullable: true
        lastNameTemplate:
          type: string
          minLength: 1
          maxLength: 1000
        emailTemplate:
          type: string
          maxLength: 1000
          nullable: true
        phoneTemplate:
          type: string
          maxLength: 1000
          nullable: true
          description: >-
            Optional phone value. Fixed numbers are normalized and stored in E.164 format by
            the builder's country picker. Contact-field or earlier automation-value tokens are
            also supported and must render to a valid E.164 number when the action executes.
        dateOfBirth:
          allOf:
            - $ref: "#/components/schemas/AutomationCreateContactTypedSource"
          nullable: true
        statusConfigId:
          type: string
          description: Active contact status belonging to the automation tenant.
        assignedToUserId:
          type: string
          nullable: true
          description: Optional active tenant member assigned to the new contact.
        customFieldValues:
          type: array
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [customFieldId, source]
            properties:
              customFieldId:
                type: string
              source:
                $ref: "#/components/schemas/AutomationCreateContactValueSource"
    AutomationIfElseConfig:
      type: object
      required: [actionName, branches]
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        branches:
          type: array
          minItems: 2
          maxItems: 20
          description: Ordered condition branches followed by exactly one permanent Default branch.
          items:
            $ref: "#/components/schemas/AutomationIfElseBranch"
    AutomationIfElseBranch:
      type: object
      required: [name, isDefault, matchMode, conditions, actions]
      properties:
        branchKey:
          type: string
          format: uuid
          description: Stable branch identifier; generated by the server when omitted.
        name:
          type: string
          minLength: 1
          maxLength: 120
        isDefault:
          type: boolean
        matchMode:
          type: string
          enum: [ALL, ANY]
        conditions:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/AutomationBranchCondition"
        actions:
          type: array
          maxItems: 100
          description: Actions to run when this branch is selected. May be empty for the Default branch.
          items:
            $ref: "#/components/schemas/AutomationActionRequest"
    AutomationSplitConfig:
      type: object
      required: [actionName, routes]
      description: >-
        Random percentage routing configuration. Routes are evaluated in saved order,
        their positive whole-number percentages must total exactly 100, and route
        action lists may be empty for control groups.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        routes:
          type: array
          minItems: 2
          maxItems: 20
          items:
            $ref: "#/components/schemas/AutomationSplitRoute"
    AutomationSplitRoute:
      type: object
      required: [name, percentage, actions]
      properties:
        branchKey:
          type: string
          format: uuid
          description: Stable route identifier; generated by the server when omitted.
        name:
          type: string
          minLength: 1
          maxLength: 120
        percentage:
          type: integer
          minimum: 1
          maximum: 99
        actions:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AutomationActionRequest"
    AutomationBranchCondition:
      type: object
      required: [source, operator]
      properties:
        conditionKey:
          type: string
          format: uuid
          description: Stable condition identifier; generated by the server when omitted.
        source:
          type: string
          enum:
            - CONTACT_FIELD
            - TASK_FIELD
            - CONTACT_CUSTOM_FIELD
            - CONTACT_STATUS
            - CONTACT_ASSIGNEE
            - CONTACT_TAGS
            - AUTOMATION_VALUE
            - CURRENT_DATE_TIME
            - OPPORTUNITY_FIELD
        operator:
          type: string
          enum: [EQUALS, NOT_EQUALS, CONTAINS, NOT_CONTAINS, GREATER_THAN, GREATER_THAN_OR_EQUAL, LESS_THAN, LESS_THAN_OR_EQUAL, BETWEEN, INCLUDES_ANY, INCLUDES_ALL, EXCLUDES_ALL, IS_TRUE, IS_FALSE, IS_EMPTY, IS_NOT_EMPTY]
        fieldKey:
          type: string
        customFieldId:
          type: string
        statusConfigId:
          type: string
          nullable: true
        assignedUserId:
          type: string
          nullable: true
        tagId:
          type: string
          nullable: true
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{0,63}$"
        field:
          type: string
          enum: [VALUE, PIPELINE, PREVIOUS_STAGE, CURRENT_STAGE]
        compareValue: {}
    AutomationCustomFieldUpdate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [contactFieldKey, operation, value]
          properties:
            contactFieldKey:
              type: string
              enum:
                - firstName
                - middleName
                - lastName
                - phone
                - secondaryPhone
                - email
                - dateOfBirth
                - gender
                - height
                - weight
                - deceasedAt
                - medicarePartA
                - medicarePartB
                - smokerStatus
                - addressLine1
                - addressLine2
                - city
                - state
                - postalCode
                - country
                - mailingAddressLine1
                - mailingAddressLine2
                - mailingCity
                - mailingState
                - mailingPostalCode
                - mailingCountry
                - emergencyContactName
                - emergencyContactPhone
                - emergencyContactRelationship
                - leadDate
                - leadSource
                - leadOtherSource
            operation:
              type: string
              enum: [SET]
            value: {}
        - type: object
          additionalProperties: false
          required: [contactFieldKey, operation]
          properties:
            contactFieldKey:
              type: string
            operation:
              type: string
              enum: [CLEAR]
        - type: object
          additionalProperties: false
          required: [customFieldId, operation, value]
          properties:
            customFieldId:
              type: string
            operation:
              type: string
              enum: [SET]
            value: {}
        - type: object
          additionalProperties: false
          required: [customFieldId, operation]
          properties:
            customFieldId:
              type: string
            operation:
              type: string
              enum: [CLEAR]
    AutomationTaskDateSource:
      oneOf:
        - type: object
          required: [type]
          properties:
            type:
              type: string
              enum: [CURRENT_DATE]
        - type: object
          required: [type, amount, unit]
          properties:
            type:
              type: string
              enum: [RELATIVE_DATE]
            amount:
              type: integer
              minimum: 1
              maximum: 10000
              description: Number of tenant-local calendar units after the action execution date.
            unit:
              type: string
              enum: [DAYS, WEEKS, MONTHS]
        - type: object
          required: [type, key]
          properties:
            type:
              type: string
              enum: [CONTACT_FIELD, CUSTOM_FIELD]
            key:
              type: string
              description: Immutable safe contact or custom-field key.
        - type: object
          required: [type, date, timezone]
          properties:
            type:
              type: string
              enum: [SPECIFIC_DATE]
            date:
              type: string
              format: date
            timezone:
              type: string
              description: IANA timezone captured when the action is saved.
    AutomationTaskDateTime:
      type: object
      required: [source, time]
      properties:
        source:
          $ref: "#/components/schemas/AutomationTaskDateSource"
        time:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
    AutomationTaskConfig:
      type: object
      required: [nameTemplate, statusConfigId, assignee]
      properties:
        nameTemplate:
          type: string
          minLength: 1
          maxLength: 160
          description: >-
            Contact template resolved when the task action executes. Supports contact
            and custom fields plus current, relative, field-backed, and specific dates;
            for example {date.relative.2.weeks|date:medium}.
        descriptionTemplate:
          type: string
          maxLength: 4000
          nullable: true
        statusConfigId:
          type: string
        assignee:
          oneOf:
            - type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [UNASSIGNED, CONTACT_ASSIGNEE]
            - type: object
              required: [mode, userId]
              properties:
                mode:
                  type: string
                  enum: [SPECIFIC_USER]
                userId:
                  type: string
        linkedService:
          type: object
          nullable: true
          required: [id, nameSnapshot]
          properties:
            id:
              type: string
            nameSnapshot:
              type: string
              maxLength: 120
        dueAt:
          allOf:
            - $ref: "#/components/schemas/AutomationTaskDateTime"
          nullable: true
        reminder:
          type: object
          nullable: true
          required: [at]
          properties:
            at:
              $ref: "#/components/schemas/AutomationTaskDateTime"
            messageTemplate:
              type: string
              maxLength: 500
              nullable: true
    AutomationAppointmentStatusFilter:
      oneOf:
        - type: object
          required: [source, fieldKey, operator]
          properties:
            source:
              type: string
              enum: [CONTACT_FIELD]
            fieldKey:
              type: string
            operator:
              type: string
            compareValue:
              nullable: true
        - type: object
          required: [source, customFieldId, operator]
          properties:
            source:
              type: string
              enum: [CONTACT_CUSTOM_FIELD]
            customFieldId:
              type: string
            operator:
              type: string
            compareValue:
              nullable: true
        - type: object
          required: [source, operator]
          properties:
            source:
              type: string
              enum: [CONTACT_TAGS]
            operator:
              type: string
              enum: [EQUALS, NOT_EQUALS, IS_EMPTY, IS_NOT_EMPTY]
            tagId:
              type: string
              nullable: true
    AutomationAppointmentStatusConfig:
      type: object
      additionalProperties: false
      required: [actionName, targetMode, status, filters]
      description: >-
        Updates one appointment for the current contact. A missing appointment or
        nonmatching contact filter skips this action. The next upcoming target is
        the earliest future appointment regardless of its current status.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        targetMode:
          type: string
          enum: [TRIGGERING_APPOINTMENT, NEXT_UPCOMING]
          description: Triggering appointment requires an appointment-created or appointment-status-changed trigger.
        status:
          type: string
          enum: [SCHEDULED, CONFIRMED, SHOW, NO_SHOW, CANCELED, COMPLETED]
        filters:
          type: array
          maxItems: 20
          description: Contact field, active non-sensitive custom field, or tag conditions combined with AND.
          items:
            $ref: "#/components/schemas/AutomationAppointmentStatusFilter"
    AutomationAppointmentConfig:
      type: object
      additionalProperties: false
      required: [actionName, titleTemplate, assignee, startAt]
      description: >-
        Books a Scheduled appointment for the current contact. The tenant's current
        meeting duration and availability rules apply. An unavailable time fails the
        action. Automated bookings have no booked-by user; the audit log identifies
        the automation.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        titleTemplate:
          type: string
          minLength: 1
          maxLength: 160
        notesTemplate:
          type: string
          maxLength: 4000
          nullable: true
        assignee:
          oneOf:
            - type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [CONTACT_ASSIGNEE]
            - type: object
              required: [mode, userId]
              properties:
                mode:
                  type: string
                  enum: [SPECIFIC_USER]
                userId:
                  type: string
        linkedService:
          type: object
          nullable: true
          required: [id, nameSnapshot]
          properties:
            id:
              type: string
            nameSnapshot:
              type: string
              maxLength: 120
        startAt:
          type: object
          required: [source, time]
          properties:
            source:
              oneOf:
                - $ref: "#/components/schemas/AutomationTaskDateSource"
                - type: object
                  required: [type, key]
                  properties:
                    type:
                      type: string
                      enum: [AUTOMATION_VALUE]
                    key:
                      type: string
                      description: DATE output available on every route before this action.
            time:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
    AutomationInternalNotificationConfig:
      type: object
      additionalProperties: false
      required: [actionName, recipient, titleTemplate]
      description: >-
        Creates a persistent in-app notification for the contact's active assignee or
        one selected active tenant teammate. The notification is linked to the current
        contact and delivered over Socket.io after the automation transaction commits.
      properties:
        actionName:
          type: string
          minLength: 1
          maxLength: 120
        recipient:
          oneOf:
            - type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [CONTACT_ASSIGNEE]
            - type: object
              additionalProperties: false
              required: [mode, userId]
              properties:
                mode:
                  type: string
                  enum: [SPECIFIC_USER]
                userId:
                  type: string
        titleTemplate:
          type: string
          minLength: 1
          maxLength: 160
          description: Contact template rendered when the action executes.
        bodyTemplate:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional multiline contact template rendered when the action executes.
    AutomationDateTimeFormatterConfig:
      description: Creates a named, run-scoped value for later note and task text templates.
      oneOf:
        - type: object
          required: [mode, source, format, outputKey]
          properties:
            mode:
              type: string
              enum: [DATE]
            source:
              $ref: "#/components/schemas/AutomationFormatterDateSource"
            format:
              type: string
              enum:
                - YYYY-MM-DD
                - MM/DD/YYYY
                - DD/MM/YYYY
                - MMMM DD YYYY
                - dddd, MMMM D, YYYY
                - MMM D, YYYY
                - MMMM Do YYYY
                - MM-DD-YYYY
                - DD-MMM-YYYY
                - X
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          required: [mode, source, format, outputKey]
          properties:
            mode:
              type: string
              enum: [DATE_TIME]
            source:
              $ref: "#/components/schemas/AutomationFormatterDateSource"
            time:
              type: string
              pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
              description: Required for date-only contact, custom, specific-date, and automation-value sources.
            format:
              type: string
              enum:
                - ddd MMM DD HH:mm:ss YYYY
                - MMMM DD YYYY HH:mm:ss
                - YYYY-MM-DD HH:mm:ss
                - YYYY-MM-DD hh:mm A
                - DD/MM/YYYY HH:mm:ss
                - MM/DD/YYYY hh:mm A
                - dddd, MMMM D, YYYY hh:mm A
                - MMM D, YYYY hh:mm:ss A
                - YYYY-MM-DDTHH:mm:ss
                - MMMM Do YYYY hh:mm A
                - MM-DD-YYYY hh:mm A
                - DD-MMM-YYYY hh:mm A
                - X
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          required: [mode, from, to, unit, outputKey]
          properties:
            mode:
              type: string
              enum: [COMPARE_DATES]
            from:
              $ref: "#/components/schemas/AutomationFormatterDateSource"
            to:
              $ref: "#/components/schemas/AutomationFormatterDateSource"
            unit:
              type: string
              enum: [DAYS, MONTHS, YEARS]
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
    AutomationFormatterDateSource:
      oneOf:
        - $ref: "#/components/schemas/AutomationTaskDateSource"
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [AUTOMATION_VALUE]
            key:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
              description: Date value produced by an earlier Math operation.
    AutomationNumberSource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [CONTACT_FIELD, CUSTOM_FIELD]
            key:
              type: string
              description: Immutable safe field key compatible with the selected formatter mode.
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [AUTOMATION_VALUE]
            key:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
              description: Compatible run-scoped value produced by an earlier formatter or Math operation.
    AutomationNumberFormatterConfig:
      description: >-
        Creates a named, run-scoped numeric or formatted text value for later actions.
        An empty contact or custom-field source completes as a successful no-op and does
        not create the configured automation value.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, source, decimalMark, outputKey]
          properties:
            mode:
              type: string
              enum: [TEXT_TO_NUMBER]
            source:
              $ref: "#/components/schemas/AutomationNumberSource"
            decimalMark:
              type: string
              enum: [PERIOD, COMMA]
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [mode, source, decimalMark, groupingStyle, outputKey]
          properties:
            mode:
              type: string
              enum: [FORMAT_NUMBER]
            source:
              $ref: "#/components/schemas/AutomationNumberSource"
            decimalMark:
              type: string
              enum: [PERIOD, COMMA]
            groupingStyle:
              type: string
              enum: [COMMA_PERIOD, PERIOD_COMMA, SPACE_COMMA, SPACE_PERIOD]
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [mode, source, decimalMark, currencyCode, outputKey]
          properties:
            mode:
              type: string
              enum: [FORMAT_CURRENCY]
            source:
              $ref: "#/components/schemas/AutomationNumberSource"
            decimalMark:
              type: string
              enum: [PERIOD, COMMA]
            currencyCode:
              type: string
              enum: [USD, EUR, GBP, CAD, AUD, MXN, BRL, COP, ARS, CLP, PEN, JPY, CNY, INR, KRW, SGD, HKD, NZD, CHF, SEK, NOK, DKK, PLN, CZK, TRY, ZAR, AED, SAR, EGP, ILS]
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [mode, source, countryCode, phoneFormat, outputKey]
          properties:
            mode:
              type: string
              enum: [FORMAT_PHONE_NUMBER]
            source:
              $ref: "#/components/schemas/AutomationNumberSource"
            countryCode:
              type: string
              pattern: "^\\+\\d{1,4}$"
            phoneFormat:
              type: string
              enum: [E164, INTERNATIONAL, INTERNATIONAL_NO_COUNTRY_CODE, INTERNATIONAL_NO_HYPHENS, INTERNATIONAL_NO_SYMBOLS, NATIONAL, NATIONAL_NO_PARENTHESIS, NATIONAL_NO_SYMBOLS, RFC3966, RFC3966_NO_TEL]
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [mode, min, max, outputKey]
          properties:
            mode:
              type: string
              enum: [RANDOM_NUMBER]
            min:
              type: integer
            max:
              type: integer
              description: Inclusive maximum; must be greater than or equal to min.
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
    AutomationTextSource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [CONTACT_FIELD, CUSTOM_FIELD]
            key:
              type: string
              description: Immutable key for a safe text-like field.
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [AUTOMATION_VALUE]
            key:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
              description: Textual run-scoped value produced by an earlier action.
    AutomationTextFormatterConfig:
      description: >-
        Transforms a live text-like value and creates a named run-scoped value. Empty
        sources create deterministic empty, zero, or -1 results depending on the mode.
      oneOf:
        - type: object
          additionalProperties: false
          required: [actionName, mode, source, outputKey]
          properties:
            actionName:
              type: string
              minLength: 1
              maxLength: 120
            mode:
              type: string
              enum: [UPPER_CASE, LOWER_CASE, TITLE_CASE, CAPITALIZE, TRIM_WHITESPACE, WORD_COUNT, LENGTH, EXTRACT_EMAIL, EXTRACT_URL]
            source:
              $ref: "#/components/schemas/AutomationTextSource"
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [actionName, mode, source, defaultValue, outputKey]
          properties:
            actionName:
              type: string
              minLength: 1
              maxLength: 120
            mode:
              type: string
              enum: [DEFAULT_VALUE]
            source:
              $ref: "#/components/schemas/AutomationTextSource"
            defaultValue:
              type: string
              minLength: 1
              maxLength: 5000
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [actionName, mode, source, maxLength, outputKey]
          properties:
            actionName:
              type: string
              minLength: 1
              maxLength: 120
            mode:
              type: string
              enum: [TRIM]
            source:
              $ref: "#/components/schemas/AutomationTextSource"
            maxLength:
              type: integer
              minimum: 1
              maximum: 10000
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [actionName, mode, source, searchText, replacementText, outputKey]
          properties:
            actionName:
              type: string
              minLength: 1
              maxLength: 120
            mode:
              type: string
              enum: [REPLACE_TEXT]
            source:
              $ref: "#/components/schemas/AutomationTextSource"
            searchText:
              type: string
              minLength: 1
              maxLength: 5000
            replacementText:
              type: string
              maxLength: 5000
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [actionName, mode, source, searchText, outputKey]
          properties:
            actionName:
              type: string
              minLength: 1
              maxLength: 120
            mode:
              type: string
              enum: [FIND]
            source:
              $ref: "#/components/schemas/AutomationTextSource"
            searchText:
              type: string
              minLength: 1
              maxLength: 5000
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [actionName, mode, source, separator, segment, outputKey]
          properties:
            actionName:
              type: string
              minLength: 1
              maxLength: 120
            mode:
              type: string
              enum: [SPLIT_TEXT]
            source:
              $ref: "#/components/schemas/AutomationTextSource"
            separator:
              type: string
              minLength: 1
              maxLength: 100
              description: Literal separator; whitespace-only separators are supported.
            segment:
              type: integer
              minimum: 1
              maximum: 10000
              description: One-based segment number.
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
    AutomationMathDateSource:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [CONTACT_FIELD, CUSTOM_FIELD]
            key:
              type: string
              description: Immutable safe date-field key.
        - type: object
          additionalProperties: false
          required: [type, key]
          properties:
            type:
              type: string
              enum: [AUTOMATION_VALUE]
            key:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
              description: Date result produced by an earlier Math operation.
    AutomationMathOperationConfig:
      description: Calculates and stores a named run-scoped number or canonical YYYY-MM-DD date.
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, source, operation, operand, outputKey]
          properties:
            mode:
              type: string
              enum: [NUMBER]
            source:
              $ref: "#/components/schemas/AutomationNumberSource"
            operation:
              type: string
              enum: [ADD, SUBTRACT, MULTIPLY, DIVIDE]
            operand:
              type: number
              description: Fixed finite operand. It cannot be zero when operation is DIVIDE.
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
        - type: object
          additionalProperties: false
          required: [mode, source, operation, amount, unit, outputKey]
          properties:
            mode:
              type: string
              enum: [DATE]
            source:
              $ref: "#/components/schemas/AutomationMathDateSource"
            operation:
              type: string
              enum: [ADD, SUBTRACT]
            amount:
              type: integer
              minimum: 1
              maximum: 10000
            unit:
              type: string
              enum: [DAYS, MONTHS, YEARS]
            outputKey:
              type: string
              pattern: "^[a-z][a-z0-9_]{0,63}$"
    AutomationConditionRequest:
      type: object
      required: [source, operator]
      properties:
        source:
          type: string
          enum:
            - CONTACT_FIELD
            - TASK_FIELD
            - APPOINTMENT_FIELD
            - OPPORTUNITY_VALUE
            - CONTACT_STATUS
            - CONTACT_CUSTOM_FIELD
            - CONTACT_ASSIGNEE
            - CONTACT_TAGS
        operator:
          type: string
          enum:
            - EQUALS
            - NOT_EQUALS
            - CONTAINS
            - NOT_CONTAINS
            - GREATER_THAN
            - GREATER_THAN_OR_EQUAL
            - LESS_THAN
            - LESS_THAN_OR_EQUAL
            - BETWEEN
            - INCLUDES_ANY
            - INCLUDES_ALL
            - EXCLUDES_ALL
            - IS_TRUE
            - IS_FALSE
            - IS_EMPTY
            - IS_NOT_EMPTY
        customFieldId:
          type: string
          nullable: true
        fieldKey:
          type: string
          nullable: true
          description: Standard contact field key for CONTACT_FIELD; task fields for TASK_FIELD; or serviceId, title, notes, assignedToUserId, bookedByUserId, startAt, endAt, isAllDay for APPOINTMENT_FIELD. Appointment service and user INCLUDES_ANY use arrays of tenant IDs. IS_EMPTY on serviceId matches appointments with no service. Date comparisons use ISO date-times with an offset.
        statusConfigId:
          type: string
          nullable: true
        assignedUserId:
          type: string
          nullable: true
        tagId:
          type: string
          nullable: true
        compareValue:
          nullable: true
