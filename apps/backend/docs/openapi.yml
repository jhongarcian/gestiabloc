openapi: 3.0.3
info:
  title: Gestiabloc API
  version: 1.0.0
  description: |
    Authentication and file upload endpoints for Gestiabloc.
servers:
  - url: http://localhost:4000
    description: Local backend
tags:
  - name: Auth
  - name: Files
  - name: Account Settings
  - name: Calendar
  - name: Contacts
  - name: Contact Imports
  - name: Notifications
  - name: Tasks
  - name: Services
  - name: Automations
  - name: Automation Processes
  - name: Onboarding
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user (password-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkWithUserId"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/tenant/signup:
    post:
      tags: [Auth]
      summary: Public tenant signup
      description: Creates tenant, subscription, admin user, and membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSignupRequest"
      responses:
        "201":
          description: Tenant + admin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSignupResponse"
        "400":
          description: Invalid tenant name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (step 1) and issue OTP challenge
      description: Password verification issues a challenge. Clients can request deferred OTP delivery to render the verification view before sending email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/otp/send:
    post:
      tags: [Auth]
      summary: Send or resend a login OTP
      description: Sends an OTP for a password-verified challenge. Limited to three sends per challenge with a 30-second cooldown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpSendRequest"
      responses:
        "200":
          description: OTP delivery accepted or delivery confirmation timed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpDeliveryResponse"
        "401":
          description: Invalid or expired challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Resend cooldown or send limit reached
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds before another send may be attempted, when applicable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpDeliveryErrorResponse"
        "503":
          description: Email provider rejected delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpDeliveryErrorResponse"
  /api/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Invalid challenge or OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      tags: [Auth]
      summary: Update current user profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/password:
    patch:
      tags: [Auth]
      summary: Update current user password
      description: Requires current password and enforces 8+ chars, at least one letter, one number, and one symbol.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid current password or invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Start password reset
      description: Always returns ok to avoid account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/files/presign-upload:
    post:
      tags: [Files]
      summary: Get a signed upload target for a generic file upload
      security:
        - cookieAuth: []
      description: |
        Step 1 of 2. Use the returned `bucket`, `path`, and `token` to upload directly to Supabase Storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadRequest"
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUploadResponse"
        "400":
          description: Invalid request or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/avatar-upload:
    post:
      tags: [Files]
      summary: Upload or replace current user avatar (Vercel Blob)
      security:
        - cookieAuth: []
      description: |
        Uploads avatar directly through backend to Vercel Blob.
        Replaces previous avatar and deletes the old object when upload succeeds.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUploadRequest"
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponse"
        "400":
          description: Invalid request, unsupported type, or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/presign-download:
    post:
      tags: [Files]
      summary: Get a presigned URL to download a file
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDownloadRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignDownloadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contact-imports/{tenantId}:
    post:
      tags: [Contact Imports]
      summary: Create a contact import draft and signed private upload
      description: Tenant-admin only. Upload the CSV directly to the returned storage target, then preview it. Maximum 500 MB.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fileName, fileSize]
              properties:
                fileName: { type: string, example: contacts.csv }
                fileSize: { type: integer, minimum: 1, maximum: 524288000 }
      responses:
        "201": { description: Import draft, signed upload path, token, and bucket }
        "403": { description: Tenant administrator required }
    get:
      tags: [Contact Imports]
      summary: List recent queued and finished imports
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
      responses:
        "200": { description: Import jobs, 25 per page }
  /api/contact-imports/{tenantId}/{importId}:
    get:
      tags: [Contact Imports]
      summary: Get import progress and counters
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: importId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Import state and row counts }
        "404": { description: Import not found }
  /api/contact-imports/{tenantId}/{importId}/preview:
    post:
      tags: [Contact Imports]
      summary: Read headers and a bounded 50-row sample
      description: Tenant-admin only. Returns standard and custom-field choices and suggested mappings.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: importId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Headers, sample rows, field catalog, and suggestions }
        "400": { description: Invalid CSV, encoding, or headers }
  /api/contact-imports/{tenantId}/{importId}/queue:
    post:
      tags: [Contact Imports]
      summary: Validate mapping and enqueue the import
      description: Tenant-admin only. One active import per tenant. Full-file validation and row processing happen in the worker.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: importId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mappings, settings]
              properties:
                mappings:
                  type: array
                  description: One mapping per source header, ordered by sourceIndex. Targets are CONTACT_FIELD, CUSTOM_FIELD, or IGNORE.
                  items: { type: object }
                settings:
                  type: object
                  required: [dateFormat, phoneCountry, multiSelectSeparator, defaultStatusConfigId]
                  properties:
                    dateFormat: { type: string, enum: [YYYY-MM-DD, MM/DD/YYYY, DD/MM/YYYY], description: "Format for CSV slash dates; ISO YYYY-MM-DD is always accepted." }
                    phoneCountry: { type: string, example: US, description: "Country used to interpret national phone numbers before normalizing them to E.164." }
                    multiSelectSeparator: { type: string, example: ";" }
                    defaultStatusConfigId: { type: string, format: uuid }
      responses:
        "200": { description: Queued import }
        "409": { description: Another import is active for the tenant }
  /api/contact-imports/{tenantId}/{importId}/cancel:
    post:
      tags: [Contact Imports]
      summary: Request cancellation after the current batch
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: importId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Updated import state }
  /api/contact-imports/{tenantId}/{importId}/report-url:
    post:
      tags: [Contact Imports]
      summary: Get a 60-second private issue-report URL
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: importId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Signed download URL }
        "404": { description: No issue report available }
  /api/contacts/{tenantId}/statuses:
    get:
      tags: [Contacts]
      summary: List active contact statuses for a tenant
      description: Ensures default statuses exist and returns active status options for the tenant.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Active statuses returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsStatusesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/tags:
    get:
      tags: [Contacts]
      summary: List tenant tags for contact filters
      description: Returns tenant tags sorted for use in contact filtering UIs.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Contact tag filter options returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsTagOptionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/search:
    get:
      tags: [Contacts]
      summary: Search contacts for relationship linking
      description: Returns up to 8 ranked contacts matching name, phone, or email for the tenant.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: excludeContactId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search results returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSearchResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}:
    get:
      tags: [Contacts]
      summary: List contacts for a tenant
      description: Returns paginated contacts with optional debounced text search, filtering, and deterministic ordering.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: statusConfigIds
          required: false
          schema:
            type: string
          description: Comma-separated status config ids. Matches contacts with any selected status.
        - in: query
          name: tagIds
          required: false
          schema:
            type: string
          description: Comma-separated tenant tag ids. Matches contacts that have at least one selected tag.
        - in: query
          name: assignedToUserId
          required: false
          schema:
            type: string
          description: Membership user id, or __UNASSIGNED__ for contacts without an owner.
        - in: query
          name: sort
          required: false
          schema:
            type: string
            enum: [NAME_ASC, NAME_DESC, CREATED_DESC, CREATED_ASC, UPDATED_DESC]
            default: NAME_ASC
      responses:
        "200":
          description: Contacts returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Contacts]
      summary: Create a contact
      description: Creates a new contact in the tenant, applies the selected or default Active status, and evaluates contact-created automations against values saved in this creation request.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContactResponse"
        "400":
          description: Invalid input or invalid status config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/automations:
    get:
      tags: [Contacts]
      summary: List enabled automations available for contacts
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Enabled automation choices returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactAutomationOptionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/selection:
    get:
      tags: [Contacts]
      summary: List lightweight contact records for account-wide selection
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Contact selection records returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSelectionResponse"
  /api/automation-processes/{tenantId}:
    get:
      tags: [Automation Processes]
      summary: List current and past automation enrollment processes for the tenant
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, enum: [10, 25, 50], default: 25 }
      responses:
        "200":
          description: Process history returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationProcessListResponse"
    post:
      tags: [Automation Processes]
      summary: Create an automation enrollment process before uploading contact batches
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAutomationProcessRequest"
      responses:
        "201":
          description: Preparing process created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationProcessResponse"
  /api/automation-processes/{tenantId}/{processId}/batches:
    post:
      tags: [Automation Processes]
      summary: Upload the next batch of up to 100 contacts
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AutomationProcessIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadAutomationProcessBatchRequest"
      responses:
        "201":
          description: Batch stored for background enrollment
  /api/automation-processes/{tenantId}/{processId}/start:
    post:
      tags: [Automation Processes]
      summary: Queue a fully uploaded enrollment process
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AutomationProcessIdPathParam"
      responses:
        "200":
          description: Process queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationProcessResponse"
  /api/automation-processes/{tenantId}/{processId}/fail:
    post:
      tags: [Automation Processes]
      summary: Mark an interrupted contact upload as failed
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AutomationProcessIdPathParam"
      responses:
        "200":
          description: Preparing process marked failed
  /api/automation-processes/{tenantId}/{processId}:
    get:
      tags: [Automation Processes]
      summary: Get live enrollment progress, batches, and contact errors
      security:
