openapi: 3.0.3
info:
  title: Gestiabloc API
  version: 1.0.0
  description: |
    Authentication and file upload endpoints for Gestiabloc.
servers:
  - url: http://localhost:4000
    description: Local backend
tags:
  - name: Auth
  - name: Files
  - name: Account Settings
  - name: Calendar
  - name: Contacts
  - name: Notifications
  - name: Tasks
  - name: Services
  - name: Automations
  - name: Onboarding
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user (password-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkWithUserId"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/tenant/signup:
    post:
      tags: [Auth]
      summary: Public tenant signup
      description: Creates tenant, subscription, admin user, and membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSignupRequest"
      responses:
        "201":
          description: Tenant + admin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSignupResponse"
        "400":
          description: Invalid tenant name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (step 1) and issue OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Invalid challenge or OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      tags: [Auth]
      summary: Update current user profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/password:
    patch:
      tags: [Auth]
      summary: Update current user password
      description: Requires current password and enforces 8+ chars, at least one letter, one number, and one symbol.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid current password or invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Start password reset
      description: Always returns ok to avoid account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/files/presign-upload:
    post:
      tags: [Files]
      summary: Get a signed upload target for a generic file upload
      security:
        - cookieAuth: []
      description: |
        Step 1 of 2. Use the returned `bucket`, `path`, and `token` to upload directly to Supabase Storage.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadRequest"
      responses:
        "200":
          description: Signed upload target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignedUploadResponse"
        "400":
          description: Invalid request or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/avatar-upload:
    post:
      tags: [Files]
      summary: Upload or replace current user avatar (Vercel Blob)
      security:
        - cookieAuth: []
      description: |
        Uploads avatar directly through backend to Vercel Blob.
        Replaces previous avatar and deletes the old object when upload succeeds.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUploadRequest"
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponse"
        "400":
          description: Invalid request, unsupported type, or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/presign-download:
    post:
      tags: [Files]
      summary: Get a presigned URL to download a file
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDownloadRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignDownloadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/statuses:
    get:
      tags: [Contacts]
      summary: List active contact statuses for a tenant
      description: Ensures default statuses exist and returns active status options for the tenant.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Active statuses returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsStatusesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/tags:
    get:
      tags: [Contacts]
      summary: List tenant tags for contact filters
      description: Returns tenant tags sorted for use in contact filtering UIs.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Contact tag filter options returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsTagOptionsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/search:
    get:
      tags: [Contacts]
      summary: Search contacts for relationship linking
      description: Returns up to 8 ranked contacts matching name, phone, or email for the tenant.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: excludeContactId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Search results returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactSearchResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}:
    get:
      tags: [Contacts]
      summary: List contacts for a tenant
      description: Returns paginated contacts with optional debounced text search and status filtering.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: statusConfigIds
          required: false
          schema:
            type: string
          description: Comma-separated status config ids. Matches contacts with any selected status.
        - in: query
          name: tagIds
          required: false
          schema:
            type: string
          description: Comma-separated tenant tag ids. Matches contacts that have at least one selected tag.
      responses:
        "200":
          description: Contacts returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Contacts]
      summary: Create a contact
      description: Creates a new contact in the tenant and applies selected status or the default Active status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContactResponse"
        "400":
          description: Invalid input or invalid status config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/{contactId}:
    get:
      tags: [Contacts]
      summary: Get a single contact by id
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact details returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetailsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Contacts]
      summary: Update a contact
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetailsResponse"
        "400":
          description: Invalid input or invalid status config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/{contactId}/summary:
    get:
      tags: [Contacts]
      summary: Get contact overview summary metrics
      description: Returns aggregate payment, opportunity, task, and next-appointment metrics for the contact profile.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact overview summary returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactOverviewSummaryResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/custom-field-access-requests:
    post:
      tags: [Contacts]
      summary: Request access to a sensitive custom field
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCustomFieldAccessRequest"
      responses:
        "201":
          description: Access request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCustomFieldAccessMutationResponse"
        "400":
          description: Field is not sensitive or invalid payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User cannot request sensitive-field access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Custom field not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Access already granted or request already pending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/custom-field-access-requests/{requestId}/approve:
    post:
      tags: [Contacts]
      summary: Approve a sensitive custom-field access request
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveCustomFieldAccessRequest"
      responses:
        "200":
          description: Access request approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCustomFieldAccessMutationResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User cannot approve sensitive-field access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Access request already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/custom-field-access-requests/{requestId}/reject:
    post:
      tags: [Contacts]
      summary: Reject a sensitive custom-field access request
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: requestId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveCustomFieldAccessRequest"
      responses:
        "200":
          description: Access request rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactCustomFieldAccessMutationResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User cannot reject sensitive-field access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Access request not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Access request already resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/{contactId}/tags/search:
    get:
      tags: [Contacts]
      summary: Search available tenant tags for a contact
      description: Returns paginated tenant tags that are not yet assigned to the contact. Search input is normalized to tag slug format.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
        - in: query
          name: q
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
      responses:
        "200":
          description: Available tags returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactTagSearchResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/{contactId}/tags:
    post:
      tags: [Contacts]
      summary: Assign a tag to a contact
      description: Assigns one tenant tag to the contact. The same tag cannot be assigned twice.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactTagAssignRequest"
      responses:
        "201":
          description: Tag assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactTagAssignResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact or tag not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Contact already has this tag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/{contactId}/tags/{tagId}:
    delete:
      tags: [Contacts]
      summary: Remove a tag from a contact
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
