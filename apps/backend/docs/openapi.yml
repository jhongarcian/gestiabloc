  /api/account-settings/{tenantId}/{section}:
    get:
      tags: [Account Settings]
      summary: List account-settings resources by section
      description: |
        For `section=users`, returns tenant members with pagination.
        For `section=account`, returns tenant profile information.
        For `section=status-config`, returns contact status configuration.
        For other sections, returns `501 NOT_IMPLEMENTED` until implemented.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
        - $ref: "#/components/parameters/AccountSettingsPageQueryParam"
        - $ref: "#/components/parameters/AccountSettingsPageSizeQueryParam"
      responses:
        "200":
          description: Returned when `section=users`, `section=account`, or `section=status-config`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountSettingsUsersListResponse"
                  - $ref: "#/components/schemas/AccountSettingsTenantInfoResponse"
                  - $ref: "#/components/schemas/AccountSettingsStatusConfigListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Endpoint scaffolded but not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsNotImplementedCollectionResponse"
    patch:
      tags: [Account Settings]
      summary: Update tenant information
      description: Only valid when `section=account`. Shared with AI Company Info. Requires an active account administrator, an allowed browser origin, and the current account revision. Updates only provided fields.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSettingsTenantInfoUpdateRequest"
      responses:
        "200":
          description: Tenant profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsTenantInfoResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ACCOUNT_INFO_CONFLICT — review the latest saved account information before retrying
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Account Settings]
      summary: Create account-settings resource in section
      description: |
        For `section=status-config`, creates a new contact status.
        Other sections return `501 NOT_IMPLEMENTED` until implemented.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AccountSettingsStatusConfigCreateRequest"
                - $ref: "#/components/schemas/AccountSettingsMutationRequest"
      responses:
        "201":
          description: Returned when `section=status-config` and status is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsStatusConfigCreateResponse"
        "400":
          description: Invalid request
          content:
