            name:
              type: string
            image:
              type: string
              nullable: true
            platformRole:
              type: string
            emailVerified:
              type: boolean
            lastLoginAt:
              type: string
              format: date-time
              nullable: true
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time
            memberships:
              type: array
              items:
                type: object
                properties:
                  role:
                    type: string
                  status:
                    type: string
                  securityLevel:
                    type: string
                    enum: [LOW, MEDIUM, MAX]
