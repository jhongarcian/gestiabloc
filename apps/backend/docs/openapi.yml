  /api/services/{tenantId}/configuration-updates/{serviceId}/enrollments:
    get:
      tags: [Services]
      summary: List active service-step enrollments eligible for configuration review
      description: Tenant admins only. A group includes its offerings; an offering includes only itself. Returns at most 20 records ordered by ID, with nextCursor for continuation. Completed, canceled, template and no-step enrollments are excluded.
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: tenantId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: serviceId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: cursor, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Enrollment page with contactName, serviceName, lastApplied and nextCursor
        "401": { description: Not authenticated }
        "403": { description: Active tenant admin required }
        "404": { description: Scoped service not found }
  /api/services/{tenantId}/contact-services/{contactServiceId}/configuration-preview:
    post:
      tags: [Services]
      summary: Review current configuration against one enrollment
      description: Produces a 15-minute durable review receipt without mutating enrolled work or generating business events. Includes exact before/after differences, preserved work and blockers. Locks enrollment before configuration. Tenant admins only.
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: tenantId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Review receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  preview: { $ref: "#/components/schemas/ServiceConfigurationPreview" }
        "401": { description: Not authenticated }
        "403": { description: Active tenant admin or allowed origin required }
        "404": { description: Scoped enrollment not found }
  /api/services/{tenantId}/contact-services/{contactServiceId}/configuration-apply:
    post:
      tags: [Services]
      summary: Apply one reviewed configuration update atomically
      description: Requires the exact unexpired preview for this tenant and enrollment. Rechecks enrollment, work, waiting/queued actions, active members and current effective configuration. Applies future steps, safe checklist details/additions, professional choices and saved service workflow definitions. Preserves entered work, checklist history, billing, assignments, deadlines and pinned execution. Same-preview retries return the original receipt. No workflow execution is drained in this request.
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: tenantId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previewId]
              properties:
                previewId: { type: string, format: uuid }
      responses:
        "200":
          description: Applied receipt with appliedAt, previewId and alreadyApplied
        "400": { description: Invalid request }
        "401": { description: Not authenticated }
        "403": { description: Active tenant admin or allowed origin required }
        "404": { description: Scoped enrollment or preview not found }
        "409": { description: CONFIGURATION_PREVIEW_STALE, CONFIGURATION_PREVIEW_EXPIRED or CONFIGURATION_UPDATE_BLOCKED; refresh and review before applying }
  /api/services/{tenantId}/contact-services/{contactServiceId}/configuration-history:
    get:
      tags: [Services]
      summary: Read the last 20 applied configuration reviews for an enrollment
      security: [{ cookieAuth: [] }]
      parameters:
        - { in: path, name: tenantId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: contactServiceId, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Applied receipts with actor attribution, time and reviewed differences }
        "401": { description: Not authenticated }
        "403": { description: Active tenant admin required }
