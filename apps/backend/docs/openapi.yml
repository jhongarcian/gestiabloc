  /api/services/{tenantId}/follow-ups:
    get:
      tags: [Services]
      summary: Follow-up queue with effective deadlines and urgency
      description: >-
        Includes service-owned steps and retained manual work from retired workflows. Uses latest saved entries and a
        consistent response asOf time. Filters and ordering apply before pagination. Scheduled
        completion automation work is separate from actionable deadlines. Unentered, superseded,
        completed and paused work cannot be overdue. Summary counts cover unfinished work within the selected service/sub-service scope
        independently of other list filters. No configuration or workflow changes are made.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - { in: query, name: serviceGroupId, description: Parent service scope; intersects serviceId when both are supplied., schema: { type: string, format: uuid } }
        - { in: query, name: serviceId, description: Exact sub-service scope., schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 } }
        - { in: query, name: pageSize, schema: { type: integer, enum: [10, 25], default: 10 } }
        - { in: query, name: search, schema: { type: string, maxLength: 200 } }
        - { in: query, name: sort, schema: { type: string, enum: [URGENCY, UPDATED_DESC, STARTED_DESC, CONTACT_ASC, SERVICE_ASC], default: URGENCY } }
        - { in: query, name: queueState, schema: { type: string, enum: [ACTIONABLE, SCHEDULED, NEEDS_ATTENTION, FINISHED] } }
        - { in: query, name: status, schema: { type: string, enum: [PENDING, ACTIVE, COMPLETED, SKIPPED, POSTPONED] } }
        - { in: query, name: dueDatePreset, schema: { type: string, enum: [OVERDUE, DUE_SOON, TODAY, NEXT_7_DAYS, NO_DUE_DATE] } }
        - { in: query, name: assignedToUserId, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Queue page ordered using the latest effective deadlines
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  asOf: { type: string, format: date-time }
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ServiceFollowUpQueueItem"
                  pagination:
                    type: object
                    properties:
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
                      totalPages: { type: integer }
                  summary:
                    type: object
                    properties:
                      servicesInProgress: { type: integer }
                      overdueEnrollments: { type: integer }
                      dueToday: { type: integer }
                      dueSoon: { type: integer }
                      actionable: { type: integer }
                      scheduled: { type: integer }
                      needsAttention: { type: integer }
                      averageProgress: { type: integer }
        "400": { description: Invalid queue query }
        "401": { description: Not authenticated }
        "403": { description: Tenant access denied }
