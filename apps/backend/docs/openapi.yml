  /api/appointments/{tenantId}:
    get:
      tags: [Calendar]
      summary: List appointments for a calendar range
      description: |
        Supports user-mode and group-mode filtering. User-mode accepts one or more selected users.
        Group-mode accepts one or more reusable staff groups and expands them to active, calendar-enabled members.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: view
          schema:
            type: string
            enum: [month, week, day, list]
        - in: query
          name: filterMode
          schema:
            type: string
            enum: [users, groups]
        - in: query
          name: assignedToUserId
          schema:
            type: string
        - in: query
          name: assignedToUserIds
          schema:
            type: string
            description: Comma-separated user IDs
        - in: query
          name: groupIds
          schema:
            type: string
            description: Comma-separated calendar group IDs
        - in: query
          name: contactId
          schema:
            type: string
        - in: query
          name: serviceId
          schema:
            type: string
        - in: query
          name: from
          schema:
            type: string
            format: date-time
        - in: query
          name: to
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Appointments returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventsResponse"
        "400":
          description: Invalid filter mode or malformed filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: One or more filter IDs do not belong to the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Calendar]
      summary: Create an appointment atomically
      description: |
        Books an appointment using the tenant calendar rules and atomic conflict handling.
        If a competing booking wins the slot first, this endpoint returns `409 APPOINTMENT_TIME_UNAVAILABLE`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCalendarAppointmentRequest"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCalendarAppointmentResponse"
        "400":
          description: Invalid request
