openapi: 3.0.3
info:
  title: Gestiabloc API
  version: 1.0.0
  description: |
    Authentication and file upload endpoints for Gestiabloc.
servers:
  - url: http://localhost:4000
    description: Local backend
tags:
  - name: Auth
  - name: Files
  - name: Account Settings
  - name: Contacts
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a user (password-based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkWithUserId"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/tenant/signup:
    post:
      tags: [Auth]
      summary: Public tenant signup
      description: Creates tenant, subscription, admin user, and membership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantSignupRequest"
      responses:
        "201":
          description: Tenant + admin created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantSignupResponse"
        "400":
          description: Invalid tenant name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email or slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login (step 1) and issue OTP challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/otp/verify:
    post:
      tags: [Auth]
      summary: Verify OTP (step 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyRequest"
      responses:
        "200":
          description: OTP verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Invalid challenge or OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
    patch:
      tags: [Auth]
      summary: Update current user profile
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/me/password:
    patch:
      tags: [Auth]
      summary: Update current user password
      description: Requires current password and enforces 8+ chars, at least one letter, one number, and one symbol.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePasswordRequest"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid current password or invalid new password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/verify-email:
    get:
      tags: [Auth]
      summary: Verify email
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Email verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      summary: Start password reset
      description: Always returns ok to avoid account enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid or expired token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /api/files/presign-upload:
    post:
      tags: [Files]
      summary: Get a presigned POST for a generic file upload
      security:
        - cookieAuth: []
      description: |
        Step 1 of 2. Use the returned `url` and `fields` to upload directly to S3 via multipart/form-data.
        The client must send a POST request to `url` with all `fields`, a `Content-Type` field, and the `file` itself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignUploadRequest"
      responses:
        "200":
          description: Presigned POST data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignPostResponse"
        "400":
          description: Invalid request or unsupported content type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/avatar-upload:
    post:
      tags: [Files]
      summary: Upload or replace current user avatar (Vercel Blob)
      security:
        - cookieAuth: []
      description: |
        Uploads avatar directly through backend to Vercel Blob.
        Replaces previous avatar and deletes the old object when upload succeeds.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AvatarUploadRequest"
      responses:
        "200":
          description: Avatar uploaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadResponse"
        "400":
          description: Invalid request, unsupported type, or file too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/files/presign-download:
    post:
      tags: [Files]
      summary: Get a presigned URL to download a file
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PresignDownloadRequest"
      responses:
        "200":
          description: Presigned URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignDownloadResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: File not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/statuses:
    get:
      tags: [Contacts]
      summary: List active contact statuses for a tenant
      description: Ensures default statuses exist and returns active status options for the tenant.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      responses:
        "200":
          description: Active statuses returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsStatusesResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}:
    get:
      tags: [Contacts]
      summary: List contacts for a tenant
      description: Returns paginated contacts with optional debounced text search and status filtering.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: query
          name: page
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          required: false
          schema:
            type: integer
            enum: [10, 25]
            default: 10
        - in: query
          name: search
          required: false
          schema:
            type: string
            maxLength: 120
        - in: query
          name: statusConfigId
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Contacts returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactsListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Contacts]
      summary: Create a contact
      description: Creates a new contact in the tenant and applies selected status or the default Active status.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactRequest"
      responses:
        "201":
          description: Contact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateContactResponse"
        "400":
          description: Invalid input or invalid status config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/contacts/{tenantId}/{contactId}:
    get:
      tags: [Contacts]
      summary: Get a single contact by id
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Contact details returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetailsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Contacts]
      summary: Update a contact
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: contactId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContactRequest"
      responses:
        "200":
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactDetailsResponse"
        "400":
          description: Invalid input or invalid status config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: User is not an active member of the tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Contact not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account-settings/{tenantId}/{section}:
    get:
      tags: [Account Settings]
      summary: List account-settings resources by section
      description: |
        For `section=users`, returns tenant members with pagination.
        For `section=account`, returns tenant profile information.
        For `section=status-config`, returns contact status configuration.
        For other sections, returns `501 NOT_IMPLEMENTED` until implemented.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
        - $ref: "#/components/parameters/AccountSettingsPageQueryParam"
        - $ref: "#/components/parameters/AccountSettingsPageSizeQueryParam"
      responses:
        "200":
          description: Returned when `section=users`, `section=account`, or `section=status-config`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AccountSettingsUsersListResponse"
                  - $ref: "#/components/schemas/AccountSettingsTenantInfoResponse"
                  - $ref: "#/components/schemas/AccountSettingsStatusConfigListResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Endpoint scaffolded but not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsNotImplementedCollectionResponse"
    patch:
      tags: [Account Settings]
      summary: Update tenant information
      description: Only valid when `section=account`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSettingsTenantInfoUpdateRequest"
      responses:
        "200":
          description: Tenant profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsTenantInfoResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Account Settings]
      summary: Create account-settings resource in section
      description: |
        For `section=status-config`, creates a new contact status.
        Other sections return `501 NOT_IMPLEMENTED` until implemented.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AccountSettingsStatusConfigCreateRequest"
                - $ref: "#/components/schemas/AccountSettingsMutationRequest"
      responses:
        "201":
          description: Returned when `section=status-config` and status is created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsStatusConfigCreateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Endpoint scaffolded but not implemented yet (non status-config sections)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsNotImplementedCollectionResponse"
  /api/account-settings/{tenantId}/users:
    post:
      tags: [Account Settings]
      summary: Create tenant member user
      description: |
        Tenant-admin only. Creates a new user account, adds membership to the tenant,
        and sends an email verification link.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantUserRequest"
      responses:
        "201":
          description: User created and verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTenantUserResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email in use or seat limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/account-settings/{tenantId}/{section}/{recordId}:
    put:
      tags: [Account Settings]
      summary: Replace account-settings record in section
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
        - $ref: "#/components/parameters/AccountSettingsRecordIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountSettingsMutationRequest"
      responses:
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Endpoint scaffolded but not implemented yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsNotImplementedRecordResponse"
    patch:
      tags: [Account Settings]
      summary: Update account-settings record in section
      description: |
        For `section=status-config`, updates a contact status.
        Other sections return `501 NOT_IMPLEMENTED` until implemented.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
        - $ref: "#/components/parameters/AccountSettingsRecordIdPathParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/AccountSettingsStatusConfigUpdateRequest"
                - $ref: "#/components/schemas/AccountSettingsMutationRequest"
      responses:
        "200":
          description: Returned when `section=status-config` and status is updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsStatusConfigUpdateResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Returned when `section=status-config` and status is not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Returned when `section=status-config` and status is default or in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Endpoint scaffolded but not implemented yet (non status-config sections)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsNotImplementedRecordResponse"
    delete:
      tags: [Account Settings]
      summary: Delete account-settings record in section
      description: |
        For `section=status-config`, deletes a contact status when it is not a default
        and not currently used by contacts.
        Other sections return `501 NOT_IMPLEMENTED` until implemented.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - $ref: "#/components/parameters/AccountSettingsSectionPathParam"
        - $ref: "#/components/parameters/AccountSettingsRecordIdPathParam"
      responses:
        "200":
          description: Returned when `section=status-config` and status is deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Returned when `section=status-config` and status is not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Returned when `section=status-config` and status is default or in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "501":
          description: Endpoint scaffolded but not implemented yet (non status-config sections)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSettingsNotImplementedRecordResponse"
  /api/account-settings/{tenantId}/users/{userId}/security-level:
    patch:
      tags: [Account Settings]
      summary: Update member security level
      description: Tenant-admin only. Tenant admins are fixed at `MAX`.
      security:
        - cookieAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantIdPathParam"
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberSecurityLevelRequest"
      responses:
        "200":
          description: Security level updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateMemberSecurityLevelResponse"
        "400":
          description: Invalid request or invalid level for tenant admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a tenant admin for this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Member not found for tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    TenantIdPathParam:
      in: path
      name: tenantId
      required: true
      schema:
        type: string
    AccountSettingsSectionPathParam:
      in: path
      name: section
      required: true
      schema:
        type: string
        enum:
          - users
          - account
          - services
          - professionals
          - follow-ups
          - status-config
          - features
          - subscription
          - custom-fields
    AccountSettingsRecordIdPathParam:
      in: path
      name: recordId
      required: true
      schema:
        type: string
    AccountSettingsPageQueryParam:
      in: query
      name: page
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    AccountSettingsPageSizeQueryParam:
      in: query
      name: pageSize
      required: false
      schema:
        type: integer
        enum: [10, 25]
        default: 10
  schemas:
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
    OkWithUserId:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        userId:
          type: string
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "INVALID_CREDENTIALS"
        details:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        name:
          type: string
    TenantSignupRequest:
      type: object
      required: [tenantName, planKey, adminName, adminEmail, adminPassword]
      properties:
        tenantName:
          type: string
        planKey:
          type: string
          enum: [STARTER, PRO, BUSINESS]
        paidNow:
          type: boolean
          default: false
        adminName:
          type: string
        adminEmail:
          type: string
          format: email
        adminPassword:
          type: string
          minLength: 8
    TenantSignupResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        tenantId:
          type: string
        userId:
          type: string
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        requiresOtp:
          type: boolean
        challengeToken:
          type: string
          nullable: true
    OtpVerifyRequest:
      type: object
      required: [challengeToken, code]
      properties:
        challengeToken:
          type: string
        code:
          type: string
          description: 6-digit OTP
          pattern: "^[0-9]{6}$"
    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
          description: Must include at least one letter, one number, and one symbol.
    UpdateMeRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
