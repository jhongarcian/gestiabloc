    AutomationServiceContext:
      type: object
      nullable: true
      description: >-
        Immutable enrollment attribution. Null for ordinary contact automations and older history.
        Validated against the tenant and contact when queued and before every execution segment.
        The saved enrollment step and source step must both be supplied together. An occurrence
        requires its saved step. Context is retained across waits, branches, and chained workflows;
        records are never inferred from a contact. Invalid ownership fails with INVALID_SERVICE_CONTEXT.
      required: [contactServiceId, serviceId, contactServiceStepId, serviceStepId, serviceStepOccurrenceId]
      additionalProperties: false
      properties:
        contactServiceId:
          type: string
          format: uuid
        serviceId:
          type: string
          format: uuid
          description: Enrolled sub-service ID, including when the step is inherited from a parent.
        contactServiceStepId:
          type: string
          format: uuid
          nullable: true
          description: Saved enrollment step definition ID.
        serviceStepId:
          type: string
          format: uuid
          nullable: true
          description: Original service configuration step ID; archival does not invalidate attribution.
        serviceStepOccurrenceId:
          type: string
          format: uuid
          nullable: true
          description: Exact step-entry occurrence ID; a revisit has its own ID.
