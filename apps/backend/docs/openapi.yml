                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  isEnabled: { type: boolean }
                  triggerType: { type: string, enum: [SERVICE_STEP_ENTERED, SERVICE_STEP_COMPLETED] }
                  _count:
                    type: object
                    properties:
                      actions: { type: integer, minimum: 0 }
